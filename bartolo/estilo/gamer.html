<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body><svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script src="lib.js"></script><script src="lib_escenas.js"></script><script src="lib_bano.js"></script>
<script>
// "Una partida más" (32 s, vertical). El videojuego de la tele es genérico y dibujado por nosotros: sin logos, personajes ni interfaz de ningún juego real.
// Horario real de la tienda: pedidos hasta las 6 p. m., entrega hacia las 6:30 p. m.
const DUR=32;
const S=[0,3.5,7.0,9.5,12.0,14.5,17.5,21.5,25.5,28.0];
const BEAT=60/149.7, beat=t=>Math.abs(Math.sin(Math.PI*t/BEAT)), land=t=>Math.pow(1-beat(t),3);
function cam(g,k,cx=540,cy=1200){return `<g transform="translate(${cx},${cy}) scale(${k}) translate(${-cx},${-cy})">${g}</g>`;}
function mv(u,a,b,x0,x1,f=ease){const p=seg(u,a,b);return {x:lerp(x0,x1,f(p)),m:p>0&&p<1};}
function big(lines,y,p,col='#fff',hl='#FFD25A',size=86){if(p<=0)return '';const k=back(Math.min(1,p*1.6));let g='';
  lines.forEach((l,i)=>{const c=l.startsWith('*')?hl:col;const s=l.replace('*','');g+=`<text x="540" y="${y+i*size*1.12}" font-family="Comic Neue" font-weight="700" font-size="${size}" fill="${c}" text-anchor="middle" stroke="${P.navy}" stroke-width="12" paint-order="stroke">${s}</text>`;});
  return `<g transform="translate(540,${y}) scale(${k}) translate(-540,${-y})">${g}</g>`;}
function gameBanner(txt,sub,y,p,col='#FFD25A'){if(p<=0)return '';const k=back(Math.min(1,p*1.5));
  return `<g transform="translate(540,${y}) scale(${k})"><rect x="-470" y="-80" width="940" height="${sub?190:130}" fill="rgba(10,10,20,.82)" stroke="${col}" stroke-width="6"/><text x="0" y="12" font-family="Inter" font-weight="900" font-size="66" fill="${col}" text-anchor="middle" letter-spacing="2">${txt}</text>${sub?`<text x="0" y="82" font-family="Inter" font-weight="700" font-size="42" fill="#fff" text-anchor="middle">${sub}</text>`:''}</g>`;}
// ---------- sala: tele a la izquierda, sofá a la derecha ----------
function juegoTV(t,paused){ // pantalla del juego genérico: calle nocturna, auto, minimapa
  let g=`<rect x="0" y="0" width="360" height="210" fill="#141a33"/>`;
  for(let i=0;i<5;i++){const x=((i*90-t*120)%450+450)%450-60;g+=`<rect x="${x}" y="${40+(i%3)*12}" width="50" height="${110-(i%3)*12}" fill="#2a3360"/><rect x="${x+10}" y="${55+(i%3)*12}" width="10" height="10" fill="#ffd25a" opacity=".8"/>`;}
  g+=`<rect x="0" y="150" width="360" height="60" fill="#333"/>`;for(let i=0;i<6;i++){const x=((i*80-t*300)%480+480)%480-60;g+=`<rect x="${x}" y="178" width="40" height="5" fill="#ddd"/>`;}
  const cy=150+Math.sin(t*6)*3;g+=`<rect x="140" y="${cy-8}" width="80" height="26" rx="8" fill="#e05a47"/><rect x="155" y="${cy-24}" width="46" height="20" rx="6" fill="#e05a47"/><circle cx="158" cy="${cy+20}" r="9" fill="#111"/><circle cx="204" cy="${cy+20}" r="9" fill="#111"/>`;
  g+=`<circle cx="320" cy="40" r="28" fill="rgba(0,0,0,.5)" stroke="#fff" stroke-width="3"/><circle cx="320" cy="40" r="5" fill="#ffd25a"/>`;
  if(paused)g+=`<rect width="360" height="210" fill="rgba(0,0,0,.55)"/><text x="180" y="122" font-family="Inter" font-weight="900" font-size="54" fill="#fff" text-anchor="middle" letter-spacing="4">PAUSA</text>`;
  return g;}
function sala(t,o={}){
  let g=`<rect width="1080" height="1920" fill="#1E3A44"/>`;
  g+=`<g filter="url(#wob)"><rect x="660" y="430" width="300" height="300" rx="24" fill="${o.dusk?'#c9845f':'#0B1620'}" ${ol()}/><path d="M810,430 V730 M660,580 H960" ${ol()}/></g>`;
  if(o.dusk)g+=`<circle cx="760" cy="640" r="30" fill="#ffd9a0"/>`;
  // reloj de pared
  const hr=o.hour??16, min=o.min??0, ah=((hr%12)+min/60)*30, am=min*6;
  g+=`<g transform="translate(300,560)" filter="url(#wob)"><circle r="78" fill="${P.cream}" ${ol()}/><path d="M0,0 L0,-42" stroke="${P.navy}" stroke-width="9" stroke-linecap="round" transform="rotate(${ah})"/><path d="M0,0 L0,-62" stroke="${P.terra}" stroke-width="6" stroke-linecap="round" transform="rotate(${am})"/><circle r="7" fill="${P.navy}"/></g>`;
  g+=`<rect x="0" y="1480" width="1080" height="440" fill="#13252F"/><path d="M0,1480 H1080" ${ol()}/>`;
  // mueble y tele
  g+=`<g filter="url(#wob)"><rect x="40" y="1330" width="420" height="150" rx="10" fill="#5A3E33" ${ol()}/><rect x="60" y="1080" width="380" height="230" rx="12" fill="#111" ${ol()}/></g>`;
  g+=`<g transform="translate(70,1090)">${juegoTV(t,o.paused)}</g>`;
  g+=`<circle cx="250" cy="1200" r="${330}" fill="#6fa8ff" opacity="${o.tvGlow??0.18}" filter="url(#blur40)"/>`;
  // sofá
  g+=`<g filter="url(#wob)"><rect x="560" y="1110" width="500" height="240" rx="50" fill="#7E4338" ${ol()}/></g>`;
  return g;}
function sofaDelante(){return `<g filter="url(#wob)"><rect x="540" y="1320" width="540" height="140" rx="40" fill="#8E4A3F" ${ol()}/><path d="M580,1460 V1500 M1040,1460 V1500" stroke="${P.line}" stroke-width="14" stroke-linecap="round"/></g>`;}
function plato(x,y,lleno){return `<g transform="translate(${x},${y})" filter="url(#wob)"><path d="M-80,-30 L80,-30 L64,0 L-64,0 Z" fill="${P.teal}" ${ol()}/>${lleno?`<ellipse cx="0" cy="-32" rx="70" ry="16" fill="#9C6B3E" ${ol(4)}/>`:`<ellipse cx="0" cy="-32" rx="70" ry="12" fill="#2a4a50" ${ol(4)}/>`}</g>`;}
function control(x,y){return `<g transform="translate(${x},${y})"><rect x="-34" y="-16" width="68" height="32" rx="14" fill="#222" stroke="${P.navy}" stroke-width="4"/><circle cx="14" cy="-2" r="5" fill="#e05a47"/><circle cx="-14" cy="-2" r="5" fill="#4ba3c7"/></g>`;}
function dueno(t,o={}){ // dueño sentado en el sofá mirando a la izquierda (hacia la tele)
  const oo=Object.assign({armA:'offer',smile:false},o);
  let g=owner2(800,1360,1.0,oo);
  if(o.ctrl!==false){const h=ownerHand(800,1360,1.0,oo);g+=control(h.x,h.y+Math.sin(t*20)*3);}
  return g;}
function maxEnojo(x,y,k,t,lvl){ // Max sentado con ceño fruncido y humo; lvl 0..1
  let g=max2(x,y,k,{expr:'up',wag:0});
  g+=`<g transform="translate(${x},${y}) scale(${k})"><path d="M78,-266 L120,-246" stroke="${P.navy}" stroke-width="10" stroke-linecap="round"/><path d="M110,-176 q14,-10 28,0" stroke="${P.navy}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  g+=`<ellipse cx="80" cy="-214" rx="70" ry="60" fill="#e05a47" opacity="${0.28*lvl}"/>`;
  for(let i=0;i<3;i++){const p=((t*1.4+i/3)%1);g+=`<circle cx="${20+p*-30}" cy="${-280-p*90}" r="${10+p*16}" fill="#fff" opacity="${lvl*(1-p)}" ${ol(3)}/>`;}
  g+=`</g>`;return g;}
function hearts(cx,y,n,hit,t,pulse){return heartBar(cx,y,7,{n,hit,pulse},t);}
// ---------- render ----------
function render(t){
  let g='',i=0;while(i<S.length-1&&t>=S[i+1])i++;const u=t-S[i];
  if(i===0){ g+=sala(t,{hour:16,min:0});g+=plato(200,1560,false)+dueno(t)+sofaDelante()+max2(360,1600,1.1,{expr:'up',wag:Math.sin(t*6)*8});
    g=cam(g,1+u*0.01);g+=big(['Una partida más...'],330,seg(u,0.3,0.7));
    g+=hearts(540,880,5,0,t);
  } else if(i===1){ const p=seg(u,0.2,3.0),mins=lerp(0,105,p);const hr=16+Math.floor(mins/60),mn=Math.floor(mins%60);
    g+=sala(t,{hour:hr,min:mn,dusk:p>0.7});g+=plato(200,1560,false)+dueno(t)+sofaDelante()+max2(360,1600,1.1,{expr:'up'});
    g=cam(g,1.03);const lab=`${hr-12}:${String(mn).padStart(2,'0')} p. m.`;g+=big([lab],330,1);
    const n=u<1.5?5:u<2.7?4:3;g+=hearts(540,880,n,u>1.5&&u<1.9?seg(u,1.5,1.9):(u>2.7&&u<3.1?seg(u,2.7,3.1):0),t);
  } else if(i===2){ g+=sala(t,{hour:17,min:40,dusk:true,tvGlow:0.1});g+=plato(200,1560,false)+dueno(t)+sofaDelante()+maxEnojo(360,1600,1.1,t,seg(u,0,1));
    g=cam(g,1.35+u*0.04,420,1450);g+=big(['*Grrr...'],330,seg(u,0.6,1.0),'#fff','#e05a47',110);
    g+=hearts(540,560,u<0.6?3:2,u>0.6&&u<1.0?seg(u,0.6,1.0):0,t,true);
  } else if(i===3){ const j=mv(u,0.2,0.9,360,560);g+=sala(t,{hour:17,min:42,dusk:true,paused:u>0.9});
    g+=plato(200,1560,false)+dueno(t,{armA:'offer',armB:'rest',armP:seg(u,0.9,1.3),ctrl:u<0.9,oops:u>0.9})+sofaDelante();
    if(u>0.9)g+=control(lerp(700,560,seg(u,0.9,1.3)),lerp(1240,1480,seg(u,0.9,1.3)));
    g+=maxEnojo(j.x,1600-Math.sin(seg(u,0.2,0.9)*Math.PI)*220,1.1,t,1);
    g=cam(g,1.05);g+=big(['¡¿Y MI COMIDA?!'],330,seg(u,1.0,1.3),'#fff','#FFD25A',100);
    g+=hearts(540,880,2,0,t,true);
  } else if(i===4){ g+=sala(t,{hour:17,min:44,dusk:true,paused:true});g+=plato(200,1560,false)+dueno(t,{armA:'rest',ctrl:false,oops:true,look:'down'})+sofaDelante()+maxEnojo(400,1600,1.1,t,0.7);
    if(u>1.5){const p=back(seg(u,1.5,1.9));g+=`<g transform="translate(860,800) scale(${p})"><circle r="70" fill="#FFD25A" opacity=".35" filter="url(#blur14)"/><path d="M-36,10 C-60,-60 60,-60 36,10 L24,40 L-24,40 Z" fill="#FFD25A" ${ol()}/><rect x="-22" y="44" width="44" height="22" rx="6" fill="${P.line}"/></g>`;}
    g=cam(g,1.03);g+=big(['¡Se acabó','*el concentrado!'],330,seg(u,0.2,0.6));
  } else if(i===5){ g+=`<rect width="1080" height="1920" fill="#16232c"/>`;
    g+=`<g filter="url(#wob)"><rect x="260" y="330" width="560" height="1160" rx="70" fill="#111" ${ol()}/></g><rect x="290" y="370" width="500" height="1080" rx="40" fill="#ECE5DD"/>`;
    g+=`<rect x="290" y="370" width="500" height="150" rx="40" fill="${P.teal}"/><rect x="290" y="450" width="500" height="70" fill="${P.teal}"/><text x="540" y="410" font-family="Inter" font-weight="700" font-size="26" fill="#fff" text-anchor="middle">5:45 p. m.</text><text x="540" y="480" font-family="Inter" font-weight="800" font-size="40" fill="#fff" text-anchor="middle">Bartolo Pet Shop</text>`;
    const b1=back(seg(u,0.4,0.8)),b2=back(seg(u,1.6,2.0));
    g+=`<g transform="translate(760,700) scale(${b1})"><rect x="-420" y="-70" width="420" height="140" rx="24" fill="#DCF8C6" stroke="${P.navy}" stroke-width="4"/><text x="-210" y="-12" font-family="Comic Neue" font-weight="700" font-size="36" fill="${P.navy}" text-anchor="middle">Hola Bartolo, necesito</text><text x="-210" y="34" font-family="Comic Neue" font-weight="700" font-size="36" fill="${P.navy}" text-anchor="middle">concentrado para Max</text></g>`;
    g+=`<g transform="translate(320,900) scale(${b2})"><rect x="0" y="-60" width="380" height="120" rx="24" fill="#fff" stroke="${P.navy}" stroke-width="4"/><text x="190" y="-6" font-family="Comic Neue" font-weight="700" font-size="36" fill="${P.navy}" text-anchor="middle">¡Va en camino!</text><text x="190" y="38" font-family="Comic Neue" font-weight="700" font-size="30" fill="${P.terra}" text-anchor="middle">Llega a las 6:30</text></g>`;
    g=cam(g,1+u*0.02,540,900);
  } else if(i===6){ let v=streetDay(t);v+=`<rect width="1080" height="1920" fill="#e07a3c" opacity=".22"/>`;const bob=Math.sin(t*18)*3;
    v+=`<ellipse cx="540" cy="1505" rx="230" ry="18" fill="#000" opacity=".2"/><g transform="translate(0,${bob})">`+bartolo(470,1425,1.0,{expr:'happy'})+`<g transform="translate(470,1425)" filter="url(#wob)">${HELMET}</g>`+scooterMin(540,1500,1.3,t)+`</g>`;
    g+=cam(v,1+u*0.01);
    g+=gameBanner('NUEVA MISIÓN','Concentrado para Max',360,seg(u,0.2,0.6));
    const mp=seg(u,0,4);g+=`<g transform="translate(170,1700)"><circle r="120" fill="rgba(10,10,20,.75)" stroke="#fff" stroke-width="5"/><path d="M-80,40 L-20,-10 L30,20 L70,-50" stroke="#FFD25A" stroke-width="10" fill="none" stroke-dasharray="6 14"/><circle cx="${lerp(-80,70,mp)}" cy="${lerp(40,-50,mp)}" r="14" fill="${P.terra}" stroke="#fff" stroke-width="4"/>${paw(70,-62,0.8,'#fff')}</g>`;
    g+=`<text x="900" y="1730" font-family="Inter" font-weight="900" font-size="56" fill="#fff" text-anchor="middle" stroke="${P.navy}" stroke-width="8" paint-order="stroke">${(lerp(1.2,0.1,mp)).toFixed(1).replace('.',',')} km</text>`;
  } else if(i===7){ g+=sala(t,{hour:18,min:30,dusk:true,paused:true});
    const bx=mv(u,0,1.0,-250,130).x;g+=dueno(t,{armA:'rest',ctrl:false,smile:true})+sofaDelante()+plato(270,1580,u>1.4);
    g+=bartolo(bx,1600,1.05,{expr:'happy'})+`<g transform="translate(${bx},1600) scale(1.05)" filter="url(#wob)"><rect x="-100" y="-290" width="96" height="82" rx="8" fill="${P.terra}" ${ol()}/>${paw(-52,-250,1.1,P.cream)}</g>`;
    g+=max2(430,1600-(u>1.4?land(t)*12:0),1.1,{expr:u>1.4?'happy':'up',chew:u>1.6?t*20:0,wag:Math.sin(t*16)*28});
    g=cam(g,1.02);
    if(u<0.9)g+=big(['*¡Ding dong!'],330,seg(u,0.05,0.35));
    g+=gameBanner('¡PEDIDO ENTREGADO!','6:30 p. m.',360,seg(u,1.6,2.0));
    const n=u<1.8?2:Math.min(5,2+Math.floor((u-1.8)/0.5)+1);g+=heartBar(540,880,7,{n,gain:u>1.8&&u<3.3?seg((u-1.8)%0.5,0,0.25):0,shine:u>3.3},t);
  } else if(i===8){ g+=sala(t,{hour:18,min:40,dusk:true});g+=plato(200,1560,true)+dueno(t,{smile:true})+maxLie(560,1330,0.95,{t,expr:'happy'})+sofaDelante();
    g=cam(g,1+u*0.01);g+=big(['Tú sigue jugando.'],330,seg(u,0.2,0.6));
  } else { g+=`<rect width="1080" height="1920" fill="${P.teal}"/><circle cx="540" cy="900" r="${560+30*(1-beat(t))}" fill="#3BA3A0"/>`;
    g+=big(['Bartolo','*te lo lleva.'],330,seg(u,0.1,0.5),'#fff','#FFD25A',110);
    g+=`<ellipse cx="560" cy="1135" rx="230" ry="20" fill="#000" opacity=".25"/>`+bartolo(500,1130-land(t)*16,1.7,{expr:'happy'});
    const p=back(seg(u,0.5,0.9));g+=`<g transform="translate(540,1340) scale(${p})"><rect x="-430" y="-90" width="860" height="180" rx="40" fill="#fff" stroke="${P.navy}" stroke-width="8"/><text x="0" y="36" font-family="Inter" font-weight="800" font-size="104" fill="${P.terra}" text-anchor="middle">314 585 6688</text></g>`;
    g+=`<text x="540" y="1540" font-family="Inter" font-weight="800" font-size="60" fill="${P.cream}" text-anchor="middle" opacity="${seg(u,0.9,1.2)}">patitas.win</text>`;
    g+=`<text x="540" y="1640" font-family="Comic Neue" font-weight="700" font-size="52" fill="#fff" text-anchor="middle" opacity="${seg(u,1.1,1.4)}">Pedidos hasta las 6 p. m. · Bello</text>`;
  }
  g+=barsC(i<9);
  for(const c of S.slice(1)){const f=1-Math.abs(t-c)/0.1;if(f>0)g+=`<rect width="1080" height="1920" fill="#fff" opacity="${f*0.5}"/>`;}
  if(DUR-t<0.5)g+=`<rect width="1080" height="1920" fill="#000" opacity="${1-(DUR-t)/0.5}"/>`;
  document.getElementById('s').innerHTML=defs+DEFS_DIA+g;
}
window.render=render;render(parseFloat(new URLSearchParams(location.search).get('t'))||1);
</script></body></html>
